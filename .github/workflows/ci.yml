name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }  # debe coincidir con pnpm local; pnpm-workspace.yaml usa claves de v10
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }  # 22+ trae WebSocket nativo (lo exige @supabase/realtime-js)
      - run: pnpm install --frozen-lockfile
      # ⚠️ EL CENTINELA YA NO CORRE EN CI. El motor salió de este repo el 2026-08-31 y ahora es
      # un plugin instalado por desarrollador (WSmithDR/centinela-plugin), con sus reglas en el
      # repo de datos de cada uno. Nada de eso existe en un runner.
      #
      # Lo que se perdió, dicho en voz alta: `pnpm rules:check` corría los tests que las reglas
      # declaran y verificaba que ninguna hubiera cambiado sin subir su version. Hoy eso sólo
      # pasa en la máquina de quien edita. Un detector roto vuelve a poder pasar sin que nadie
      # se entere — que es exactamente el motivo por el que este paso se había agregado.
      #
      # Para recuperarlo hace falta que el runner pueda clonar el plugin, que es privado: un
      # deploy key o un token en los secrets del repo.
      - run: pnpm typecheck
      - run: pnpm lint
      # tsc no mira CSS: una comilla suelta en un .module.css pasaba el typecheck entero.
      - run: pnpm lint:css
      - run: pnpm test
      - run: pnpm build
        env:
          # build de Next: envs públicas dummy para CI (no se conecta a Supabase real)
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_ENV: local
          # env del servidor (env.server.ts los valida al colectar las rutas /api): dummies para CI
          SUPABASE_SECRET_KEY: dummy-service-role-key
          RESEND_API_KEY: re_dummy_key

  e2e-shard:
    name: e2e (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # 4 shards para 27 spec files: Playwright reparte por archivo con --shard y cada shard
    # levanta su propia Supabase local, así no compartimos DB entre runners. La corrida completa
    # tardó ~5.7 min en serie; 12 min por shard deja margen para install/start sin volver al
    # default de GitHub de 6 HORAS bloqueando el merge si algo se cuelga.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # Pinneada, no `latest`: con `latest` una release de Supabase puede romper el CI sin que
      # nadie toque el repo, y encima el CI correría una CLI distinta de la del devDependency.
      # Se sube a mano junto con el package.json.
      - uses: supabase/setup-cli@v1
        with: { version: 2.106.0 }
      - run: pnpm install --frozen-lockfile
      # `supabase start` levanta Postgres+Auth+REST locales y aplica supabase/migrations.
      - run: supabase start
      # La RLS se verifica contra la base real, no contra el archivo de migración:
      # el 29/08/2026 las policies estaban escritas y RLS apagada. Ver rules/base-de-datos.md.
      - run: pnpm db:rls
      # Navegador cacheado y SIN `--with-deps`. Ese flag instalaba librerías del sistema con
      # apt en cada corrida, metiendo un mirror de Ubuntu en el camino crítico: el 18/08 el
      # mirror de Azure de los runners dejó de responder y el job estuvo 20+ min agotando
      # reintentos antes de caer al mirror canónico. La imagen `ubuntu-latest` ya trae Chrome
      # y sus librerías, que son las mismas que necesita el chromium de Playwright — así que
      # apt deja de correr. Si algún día faltara una lib, el navegador falla al arrancar en
      # segundos y con mensaje claro, no colgado esperando a un servidor.
      - name: Cache del navegador de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: e2e (Playwright contra Supabase local)
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          # Keys demo de Supabase local (públicas, deterministas — NO secretos).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_APP_ENV: local
          RESEND_API_KEY: re_dummy_key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: always()
    steps:
      # La ruleset de GitHub exige un check llamado exactamente `e2e`. Si el job matrix se
      # llamara así, GitHub sólo publicaría checks por shard (`e2e (1/4)`, etc.) y el required
      # check literal quedaría pendiente para siempre. Este agregador liviano conserva ese
      # contexto y refleja el resultado real de todos los shards.
      - name: Verificar shards e2e
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "Al menos un shard e2e terminó con estado: ${{ needs.e2e-shard.result }}"
            exit 1
          fi
