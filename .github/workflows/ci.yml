name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }  # debe coincidir con pnpm local; pnpm-workspace.yaml usa claves de v10
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }  # 22+ trae WebSocket nativo (lo exige @supabase/realtime-js)
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
        env:
          # build de Next: envs públicas dummy para CI (no se conecta a Supabase real)
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_ENV: local
          # env del servidor (env.server.ts los valida al colectar las rutas /api): dummies para CI
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          RESEND_API_KEY: re_dummy_key

  e2e:
    runs-on: ubuntu-latest
    # No es la solución al cuelgue —para eso está sacar apt de arriba— sino el tope: sin esto
    # el default de GitHub son 6 HORAS de runner bloqueando el merge.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # Pinneada, no `latest`: con `latest` una release de Supabase puede romper el CI sin que
      # nadie toque el repo, y encima el CI correría una CLI distinta de la del devDependency.
      # Se sube a mano junto con el package.json.
      - uses: supabase/setup-cli@v1
        with: { version: 2.106.0 }
      - run: pnpm install --frozen-lockfile
      # `supabase start` levanta Postgres+Auth+REST locales y aplica supabase/migrations.
      - run: supabase start
      # Navegador cacheado y SIN `--with-deps`. Ese flag instalaba librerías del sistema con
      # apt en cada corrida, metiendo un mirror de Ubuntu en el camino crítico: el 18/08 el
      # mirror de Azure de los runners dejó de responder y el job estuvo 20+ min agotando
      # reintentos antes de caer al mirror canónico. La imagen `ubuntu-latest` ya trae Chrome
      # y sus librerías, que son las mismas que necesita el chromium de Playwright — así que
      # apt deja de correr. Si algún día faltara una lib, el navegador falla al arrancar en
      # segundos y con mensaje claro, no colgado esperando a un servidor.
      - name: Cache del navegador de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: e2e (Playwright contra Supabase local)
        run: pnpm e2e
        env:
          # Keys demo de Supabase local (públicas, deterministas — NO secretos).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_APP_ENV: local
          RESEND_API_KEY: re_dummy_key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
