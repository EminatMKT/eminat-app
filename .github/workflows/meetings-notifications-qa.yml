name: Meetings Notifications QA
on:
  pull_request:
    paths:
      - 'src/features/meet/**'
      - 'src/app/api/meeting-report/**'
      - 'src/app/api/meetings/notifications/**'
      - 'docs/sql/meetings-notification-outbox.review.sql'
      - 'scripts/qa/meeting-*.mjs'
      - '.github/workflows/meetings-notifications-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install isolated PostgreSQL engine
        run: npm install --prefix "$RUNNER_TEMP/meeting-pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: PostgreSQL outbox contracts (no external email or Production database)
        run: PGLITE_MODULE="$RUNNER_TEMP/meeting-pglite/node_modules/@electric-sql/pglite/dist/index.js" node scripts/qa/meeting-outbox-sql.mjs
  controlled-provider:
    if: github.event_name == 'workflow_dispatch'
    needs: isolated-sql
    runs-on: ubuntu-latest
    environment: meetings-controlled-qa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated PostgreSQL engine
        run: npm install --prefix "$RUNNER_TEMP/meeting-pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Verify real delivery to designated QA mailboxes only
        env:
          MEETINGS_QA_RESEND_API_KEY: ${{ secrets.MEETINGS_QA_RESEND_API_KEY }}
          MEETINGS_QA_RECIPIENTS: ${{ vars.MEETINGS_QA_RECIPIENTS }}
          MEETINGS_QA_ENABLE_LIVE: 'true'
        run: |
          set -o pipefail
          PGLITE_MODULE="$RUNNER_TEMP/meeting-pglite/node_modules/@electric-sql/pglite/dist/index.js" node scripts/qa/meeting-mail-live.mjs | tee meeting-qa-evidence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-meeting-mail-evidence
          path: meeting-qa-evidence.log

