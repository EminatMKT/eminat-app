name: Native Sales guarded import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Rollback rehearsal or separately approved import
        required: true
        type: choice
        default: rehearsal
        options: [rehearsal, import]
      exact_commit:
        description: Reviewed 40-character LILLY commit
        required: true
        type: string
      migration_sha256:
        description: Reviewed Native Sales migration-set digest
        required: true
        type: string
      annie_export_run:
        description: Fresh private ANNIE export run ID
        required: true
        type: string
      encrypted_sha256:
        description: SHA-256 of encrypted export
        required: true
        type: string
      rows_sha256:
        description: SHA-256 of normalized rows
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of normalized manifest
        required: true
        type: string
      source_release:
        description: Reviewed ANNIE source release
        required: true
        type: string
      verified_restore_run:
        description: Successful isolated restore verification run; required for import
        required: false
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: native-sales-production-migration
  cancel-in-progress: false

env:
  LILLY_SALES_TARGET_ENV: production
  LILLY_SALES_MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
  EXPECTED_COMMIT: ${{ inputs.exact_commit }}
  EXPORT_RUN: ${{ inputs.annie_export_run }}
  ENCRYPTED_SHA: ${{ inputs.encrypted_sha256 }}
  ROWS_SHA: ${{ inputs.rows_sha256 }}
  MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
  SOURCE_RELEASE: ${{ inputs.source_release }}
  LILLY_SUPABASE_URL: https://ruedelunbtaomhrzgelc.supabase.co

jobs:
  schema_verify:
    runs-on: ubuntu-latest
    environment: Production
    env:
      LILLY_SALES_PRODUCTION_DB_URL: ${{ secrets.LILLY_SALES_PRODUCTION_DB_URL }}
    steps:
      - name: Verify exact release inputs and separated limited credential
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LILLY_SALES_MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPORT_RUN" =~ ^[0-9]+$ ]]
          for digest in "$ENCRYPTED_SHA" "$ROWS_SHA" "$MANIFEST_SHA"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test -n "$LILLY_SALES_PRODUCTION_DB_URL"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - name: Verify applied schema and empty destination
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 scripts/migration/check_sales_database_access.py --phase data
          python3 scripts/migration/check-native-sales-migrations.py --phase data --after
          python3 scripts/migration/snapshot-native-sales-empty.py --phase data >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            https://app.stratixsolutions.us/api/health >/dev/null

  data_rehearsal:
    needs: schema_verify
    runs-on: ubuntu-latest
    environment: Production
    env:
      LILLY_SALES_PRODUCTION_DB_URL: ${{ secrets.LILLY_SALES_PRODUCTION_DB_URL }}
      ANNIE_EXPORT_READ_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      ANNIE_EXPORT_PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
      LILLY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LILLY_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EminatMKT/annie
          ref: 416d1648fcdf0f6cf70fcc3118a361e1dd2a968d
          path: .local/annie-source
          token: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare verified private source
        run: bash scripts/migration/prepare-private-annie-bundle.sh
      - name: Rehearse all rows in a rolled-back transaction
        run: |
          set -euo pipefail
          python3 scripts/migration/import-annie-sales.py .local/annie-export/bundle \
            --expected-commit "$EXPECTED_COMMIT" --expected-bundle-sha "$ROWS_SHA" \
            --expected-manifest-sha "$MANIFEST_SHA" --expected-source-release "$SOURCE_RELEASE" \
            --rehearse-db > "$RUNNER_TEMP/sales-rehearsal.log" 2>&1 \
            || { echo SALES_ROLLBACK_REHEARSAL_FAILED; exit 1; }
          python3 scripts/migration/snapshot-native-sales-empty.py --phase data >/dev/null
          python3 scripts/migration/archive-annie-membership-pdfs.py .local/annie-export/bundle \
            --rehearse-storage --expected-rows-sha256 "$ROWS_SHA" >/dev/null
      - if: always()
        run: rm -rf .local/annie-export .local/annie-source "$RUNNER_TEMP/sales-rehearsal.log"

  data_import:
    if: inputs.mode == 'import'
    needs: [schema_verify, data_rehearsal]
    runs-on: ubuntu-latest
    environment: Production
    env:
      LILLY_SALES_PRODUCTION_DB_URL: ${{ secrets.LILLY_SALES_PRODUCTION_DB_URL }}
      ANNIE_EXPORT_READ_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      ANNIE_EXPORT_PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
      PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
      RESTORE_RUN: ${{ inputs.verified_restore_run }}
      GH_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      WORKFLOW_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful independent backup and isolated restore proof
        run: |
          set -euo pipefail
          [[ "$RESTORE_RUN" =~ ^[0-9]+$ ]]
          state=$(GH_TOKEN="$WORKFLOW_TOKEN" gh run view "$RESTORE_RUN" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,workflowName --jq '[.conclusion,.workflowName] | @tsv' 2>/dev/null) || exit 1
          test "$state" = $'success\tNative Sales isolated restore verification'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EminatMKT/annie
          ref: 416d1648fcdf0f6cf70fcc3118a361e1dd2a968d
          path: .local/annie-source
          token: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare fresh verified source and recheck destination
        run: |
          set -euo pipefail
          bash scripts/migration/prepare-private-annie-bundle.sh
          python3 scripts/migration/snapshot-native-sales-empty.py --phase data >/dev/null
      - name: Import exactly once in one database transaction
        run: |
          set -euo pipefail
          python3 scripts/migration/import-annie-sales.py .local/annie-export/bundle \
            --expected-commit "$EXPECTED_COMMIT" --expected-bundle-sha "$ROWS_SHA" \
            --expected-manifest-sha "$MANIFEST_SHA" --expected-source-release "$SOURCE_RELEASE" \
            --execute > "$RUNNER_TEMP/sales-import.log" 2>&1 \
            || { echo SALES_IMPORT_FAILED_NO_CUTOVER; exit 1; }
      - if: always()
        run: rm -rf .local/annie-export .local/annie-source "$RUNNER_TEMP/sales-import.log"

  storage_archive:
    if: inputs.mode == 'import'
    needs: data_import
    runs-on: ubuntu-latest
    environment: Production
    env:
      ANNIE_EXPORT_READ_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      ANNIE_EXPORT_PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
      LILLY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LILLY_SUPABASE_SERVICE_ROLE_KEY }}
      LILLY_ARCHIVE_UPLOAD_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EminatMKT/annie
          ref: 416d1648fcdf0f6cf70fcc3118a361e1dd2a968d
          path: .local/annie-source
          token: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
          persist-credentials: false
      - name: Archive only migration-owned PDF objects
        run: |
          set -euo pipefail
          bash scripts/migration/prepare-private-annie-bundle.sh
          python3 scripts/migration/archive-annie-membership-pdfs.py .local/annie-export/bundle \
            --commit --expected-rows-sha256 "$ROWS_SHA" \
            > "$RUNNER_TEMP/sales-archive.log" 2>&1 \
            || { echo SALES_ARCHIVE_FAILED_NO_CUTOVER; exit 1; }
      - if: always()
        run: rm -rf .local/annie-export .local/annie-source "$RUNNER_TEMP/sales-archive.log"

  reconciliation:
    if: inputs.mode == 'import'
    needs: [data_import, storage_archive]
    runs-on: ubuntu-latest
    environment: Production
    env:
      LILLY_SALES_PRODUCTION_DB_URL: ${{ secrets.LILLY_SALES_PRODUCTION_DB_URL }}
      ANNIE_EXPORT_READ_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      ANNIE_EXPORT_PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
      PRIVATE_KEY: ${{ secrets.ANNIE_EXPORT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EminatMKT/annie
          ref: 416d1648fcdf0f6cf70fcc3118a361e1dd2a968d
          path: .local/annie-source
          token: ${{ secrets.ANNIE_EXPORT_READ_TOKEN }}
          persist-credentials: false
      - name: Reconcile source, target, and reference integrity
        run: |
          set -euo pipefail
          bash scripts/migration/prepare-private-annie-bundle.sh
          python3 scripts/migration/reconcile-annie-sales.py .local/annie-export/bundle \
            --expected-commit "$EXPECTED_COMMIT" --expected-bundle-sha "$ROWS_SHA" \
            --expected-manifest-sha "$MANIFEST_SHA" --expected-source-release "$SOURCE_RELEASE" \
            --execute > "$RUNNER_TEMP/sales-reconcile.log" 2>&1 \
            || { echo SALES_RECONCILIATION_FAILED_NO_CUTOVER; exit 1; }
      - if: always()
        run: rm -rf .local/annie-export .local/annie-source "$RUNNER_TEMP/sales-reconcile.log"

  final_verify:
    if: inputs.mode == 'import'
    needs: [schema_verify, data_rehearsal, data_import, storage_archive, reconciliation]
    runs-on: ubuntu-latest
    environment: Production
    env:
      LILLY_SALES_PRODUCTION_DB_URL: ${{ secrets.LILLY_SALES_PRODUCTION_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - name: Verify health, migration set, and limited DB principal
        run: |
          set -euo pipefail
          python3 scripts/migration/check_sales_database_access.py --phase data
          python3 scripts/migration/check-native-sales-migrations.py --phase data --after
          curl --fail --silent --show-error --max-time 15 \
            https://app.stratixsolutions.us/api/health >/dev/null
