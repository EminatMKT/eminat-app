name: QuickBooks reconciliation scheduler
on:
  # Production cadence belongs to the dedicated VPS timer. Manual rollback only.
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qbo-reconcile-scheduler.yml'
      - 'scripts/qa/qbo-reconcile-scheduler*.mjs'
      - 'scripts/ops/qbo-reconcile/**'
      - 'vercel.json'
permissions:
  contents: read
concurrency:
  group: qbo-reconcile-scheduler-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  scheduler-contract:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && vars.LILLY_QBO_RECONCILE_SCHEDULER_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/qa/qbo-reconcile-scheduler.checks.mjs
      - run: python3 scripts/ops/qbo-reconcile/test_worker.py
  tick:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.LILLY_QBO_RECONCILE_SCHEDULER_ENABLED == 'true'
    needs: scheduler-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Invoke LILLY reconciliation once
        env:
          LILLY_QBO_RECONCILE_SCHEDULER_ENABLED: ${{ vars.LILLY_QBO_RECONCILE_SCHEDULER_ENABLED }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/qa/qbo-reconcile-scheduler.mjs
