name: Native Sales guarded schema

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Check only or apply reviewed Native Sales schema
        required: true
        type: choice
        default: check
        options: [check, apply]
      exact_commit:
        description: Reviewed 40-character LILLY commit SHA
        required: true
        type: string
      migration_sha256:
        description: Reviewed Native Sales migration-set digest
        required: true
        type: string
      expected_pending_version:
        description: Exact 14-digit version that must be the only pending migration
        required: true
        type: string
      backup_id:
        description: Optional restorable Production backup identifier, if Supabase exposes one
        required: false
        type: string
      backup_at_utc:
        description: Verified restorable Production backup timestamp; required for apply
        required: false
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: native-sales-production-migration
  cancel-in-progress: false

jobs:
  schema_check:
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      reference: ${{ steps.fingerprint.outputs.reference }}
    env:
      LILLY_SALES_TARGET_ENV: production
      LILLY_SALES_MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
      LILLY_SALES_EXPECTED_PENDING_VERSION: ${{ inputs.expected_pending_version }}
      LILLY_SALES_SCHEMA_ADMIN_DB_URL: ${{ secrets.LILLY_SALES_SCHEMA_ADMIN_DB_URL }}
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Require main dispatch, exact SHA, checksum, and protected approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LILLY_SALES_MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LILLY_SALES_EXPECTED_PENDING_VERSION" =~ ^[0-9]{14}$ ]]
          test -n "$LILLY_SALES_SCHEMA_ADMIN_DB_URL"
          approval=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
            --jq '[.[] | select(.state == "approved") | .environments[]?.name | select(. == "Production")] | length' 2>/dev/null) || exit 1
          test "$approval" -gt 0 || { echo PRODUCTION_APPROVAL_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owner capability, pending set, and public web availability
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ inputs.exact_commit }}'
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          python3 scripts/migration/check_sales_database_access.py
          python3 scripts/migration/check-native-sales-migrations.py --phase schema
          curl --fail --silent --show-error --max-time 15 \
            https://app.stratixsolutions.us/login >/dev/null
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: Verify exact pending schema without mutation
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/native-sales-schema-dryrun.log"
          if ! supabase db push --db-url "$LILLY_SALES_SCHEMA_ADMIN_DB_URL" --dry-run --yes > "$log" 2>&1; then
            # Print only the known CLI error and local filename, never connection details.
            python3 - "$log" <<'PY'
          import pathlib, re, sys, os
          output = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          message = 'Found local migration files to be inserted before the last migration on remote database.'
          files = re.findall(r'supabase/migrations/[0-9]{14}_native_sales_[A-Za-z0-9_]+\.sql', output)
          candidates = list(pathlib.Path('supabase/migrations').glob(
              f"{os.environ['LILLY_SALES_EXPECTED_PENDING_VERSION']}_native_sales_*.sql"))
          if len(candidates) != 1:
              print('NATIVE_SALES_SCHEMA_LOCAL_MIGRATION_INVALID')
              raise SystemExit(1)
          expected = candidates[0].as_posix()
          if message not in output or files != [expected]:
              print('NATIVE_SALES_SCHEMA_DRYRUN_UNCLASSIFIED_OR_UNEXPECTED')
              raise SystemExit(1)
          print(message)
          print('Rerun the command with --include-all flag to apply these migrations:')
          print(expected)
          PY
            supabase db push --db-url "$LILLY_SALES_SCHEMA_ADMIN_DB_URL" --dry-run --include-all --yes > "$log" 2>&1 \
              || { echo NATIVE_SALES_SCHEMA_INCLUDE_ALL_DRYRUN_FAILED; exit 1; }
          fi
          echo NATIVE_SALES_SCHEMA_DRYRUN_PASS
      - id: fingerprint
        name: Capture reference counts and unrelated schema fingerprint
        run: |
          set -euo pipefail
          reference=$(python3 scripts/migration/reference_schema_fingerprint.py)
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      - if: always()
        run: rm -f "$RUNNER_TEMP/native-sales-schema-dryrun.log"

  schema_apply:
    if: inputs.phase == 'apply'
    needs: schema_check
    runs-on: ubuntu-latest
    environment: Production
    env:
      LILLY_SALES_TARGET_ENV: production
      LILLY_SALES_MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
      LILLY_SALES_EXPECTED_PENDING_VERSION: ${{ inputs.expected_pending_version }}
      LILLY_SALES_SCHEMA_ADMIN_DB_URL: ${{ secrets.LILLY_SALES_SCHEMA_ADMIN_DB_URL }}
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - name: Require a fresh restorable Production backup before schema apply
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          BACKUP_AT: ${{ inputs.backup_at_utc }}
        run: python3 scripts/migration/check_restorable_backup.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: Apply only the reviewed Native Sales pending set
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ inputs.exact_commit }}'
          python3 scripts/migration/check_sales_database_access.py
          python3 scripts/migration/check-native-sales-migrations.py --phase schema
          supabase db push --db-url "$LILLY_SALES_SCHEMA_ADMIN_DB_URL" --include-all --yes \
            > "$RUNNER_TEMP/native-sales-schema-apply.log" 2>&1 \
            || { echo NATIVE_SALES_SCHEMA_APPLY_FAILED; exit 1; }
      - if: always()
        run: rm -f "$RUNNER_TEMP/native-sales-schema-apply.log"

  schema_verify:
    if: inputs.phase == 'apply'
    needs: [schema_check, schema_apply]
    runs-on: ubuntu-latest
    environment: Production
    env:
      LILLY_SALES_TARGET_ENV: production
      LILLY_SALES_MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
      LILLY_SALES_SCHEMA_ADMIN_DB_URL: ${{ secrets.LILLY_SALES_SCHEMA_ADMIN_DB_URL }}
      EXPECTED_REFERENCE: ${{ needs.schema_check.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_commit }}
          persist-credentials: false
      - name: Verify migrations and existing LILLY modules
        run: |
          set -euo pipefail
          python3 scripts/migration/check-native-sales-migrations.py --after --phase schema
          python3 scripts/migration/reference_schema_fingerprint.py --verify "$EXPECTED_REFERENCE"
          curl --fail --silent --show-error --max-time 15 \
            https://app.stratixsolutions.us/login >/dev/null
